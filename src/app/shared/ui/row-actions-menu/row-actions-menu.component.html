<button
  #trigger
  class="single-card-actions"
  type="button"
  [disabled]="disabled()"
  (click)="toggleMenu($event)"
  (keydown.arrowdown)="openMenu($event)"
>
  <span>···</span>
</button>
@if (position(); as current) {
  <div
    #menuElement
    [id]="menuId()"
    class="dropdown-menu show row-menu"
    role="menu"
    [style.top.rem]="current.top"
    [style.left.rem]="current.left"
    (keydown.arrowdown)="moveFocus($event, 1)"
    (keydown.arrowup)="moveFocus($event, -1)"
  >
    @for (item of menuItems(); track item.id) {
      <button
        class="dropdown-item"
        [class.text-danger]="item.danger"
        type="button"
        role="menuitem"
        (click)="select(item)"
      >
        {{ item.label }}
      </button>
    }
  </div>
}
