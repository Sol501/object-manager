<section
  class="card"
>
  <header class="card-header d-flex align-items-center justify-content-between">
    <h2 class="card-title" id="linked-kpis-heading">
      Link with KPI's
    </h2>
    <button
      #linkButton
      class="header-actions"
      type="button"
      [disabled]="busy() || facade.status() !== 'loaded'"
      (click)="pickerOpen.set(true)"
    >
      <img class="add-icon" src="assets/images/add.svg" alt="" />
    </button>
  </header>
  <div class="card-body p-2 pt-0">
    @if (facade.status() === 'loading') {
      <p class  ="loading-message" role="status">Loading KPIs...</p>
    } @else if (facade.error(); as error) {
      <div class="alert alert-danger" role="alert">
        <p>{{ error }}</p>
        <button  appButton="secondary" class="mt-3" type="button" (click)="facade.load()">
          Retry
        </button>
      </div>
    } @else if (facade.status() === 'loaded') {
      <app-linked-kpis-table
        [rows]="selectedRows()"
         [busy]="busy() || !active()"
        (removed)="removeSelection($event)"
      />
    }
  </div>
</section>
@if (pickerOpen()) {
  <app-kpi-picker
    [items]="facade.items()"
    [selectedIds]= "group.controls.selectedIds.value"
    (confirmed)="confirmSelection($event)"
    (cancelled)="pickerOpen.set(false)"
  />
}
