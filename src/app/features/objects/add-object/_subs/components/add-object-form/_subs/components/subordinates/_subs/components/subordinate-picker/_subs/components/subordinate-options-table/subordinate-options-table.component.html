<div class= "table-main picker-table">
  <table appTable class="picker-table-content">
    <colgroup>
      <col class="column-select" />
      <col class="column-select" />
      <col class="column-name" />
      <col class="column-type" />
      <col class="column-status" />
      <col class="column-status" />
    </colgroup>
    <thead>
      <tr>
        <th scope="col">Select</th>
        <th scope="col">ID</th>
        <th scope="col" class="text-left">Name</th>
        <th scope="col" class="text-left">Type</th>
        <th scope="col">Active</th>
        <th scope="col">State</th>
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track row.id) {
        <tr>
          <td>
            <app-toggle-switch
              [label] ="`Select ${row.name}`"
              [checked]="selectedIds().has(row.id)"
              (changed)="toggled.emit(row.id)"
            />
          </td>
          <td>{{ row.id }}</td>
          <td class="text-left">
            <span class="table-row-title">{{ row.name }}</span>
          </td>
          <td class="text-left"><app-object-type-label [type]="row.type" /></td>
          <td>
            <img
              class ="active-status-img"
              [src]="row.active ? 'assets/images/active.svg' : 'assets/images/inactive.svg'"
              [alt]="row.active ? 'Active' : 'Inactive'"
            />
          </td>
          <td>{{ row.state }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="6">No objects match your search.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
