<div class= "table-main linked-table">
  <table appTable class="linked-table-content">
    <colgroup>
      <col class="column-status" />
      <col class="action-name-column" />
      <col  class="column-status" />
    </colgroup>
    <thead>
      <tr>
        <th scope="col">ID</th>
        <th scope="col" class="text-left">Name</th>
        <th scope="col">Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track row.id) {
        <tr>
          <td>{{ row.id }}</td>
          <td class="text-left">
            <span class="table-row-title">{{ row.name }}</span>
          </td>
          <td>
            <app-row-actions-menu
              [label]="row.name"
              [menuId]="`linked-action-menu-${row.id}`"
              [disabled]="busy()"
              (removed)="removed.emit(row.id)"
            />
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="3">No actions linked. Use the add button to select actions.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
