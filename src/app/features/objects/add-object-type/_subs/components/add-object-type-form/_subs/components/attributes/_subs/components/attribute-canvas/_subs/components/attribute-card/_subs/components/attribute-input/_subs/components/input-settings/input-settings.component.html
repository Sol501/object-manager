<app-dialog
  title="Manage Attributes"
  titleId="input-settings-title"
  panel="side"
  [showHeader]="false"
  (dismissed)="dismissed.emit()"
>
  <div [formGroup]="form">
    <nav class="nav nav-tabs settings-tabs">
      <button
        type="button"
        [class.active]="section() === 'general'"
        (click)="section.set('general')"
      >
        General
      </button>
      @if (hasOptions(value().kind)) {
        <button
          type="button"
          [class.active]="section() === 'options'"
          (click)="section.set('options')"
        >
          Options
        </button>
      }
      <button type="button" [class.active]="section() === 'source'" (click)="section.set('source')">
        Data Sorce
      </button>
      <button
        type="button"
        [class.active]="section() === 'validation'"
        (click)="section.set('validation')"
      >
        Validation
      </button>
      <button
        type="button"
        [class.active]="section() === 'conditional'"
        (click)="section.set('conditional')"
      >
        Conditional
      </button>
      <button
        type="button"
        [class.active]="section() === 'security'"
        (click)="section.set('security')"
      >
        Data security
      </button>
    </nav>
    @switch (section()) {
      @case ('general') {
        <app-input-general-settings />
      }
      @case ('options') {
        <app-input-options />
      }
      @case ('source') {
        <div formGroupName="dataSource"><app-input-source-settings /></div>
      }
      @case ('validation') {
        <div formGroupName="validation"><app-input-validation-settings /></div>
      }
      @case ('conditional') {
        <div formGroupName="conditional">
          <app-input-conditional-settings [fields]="fields()" />
        </div>
      }
      @case ('security') {
        <app-input-security-settings />
      }
    }
  </div>
  <ng-container dialog-actions>
    <button appButton="cancel" type="button" (click)="dismissed.emit()">
      <img class="button-icon" src="assets/images/rejected.svg" alt="" />Cancel
    </button>
    <button appButton="submit" type="button" (click)="save()">
      <img class="button-icon" src="assets/images/save-icon.svg" alt="" />Save
    </button>
  </ng-container>
</app-dialog>
