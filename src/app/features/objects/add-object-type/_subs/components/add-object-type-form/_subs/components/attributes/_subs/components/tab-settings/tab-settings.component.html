<app-dialog
  title="Manage Tab"
  titleId="tab-settings-title"
  panel="side"
  [showHeader]="false"
  (dismissed)="dismissed.emit()"
>
  <div [formGroup]="form">
    <ul class="nav nav-tabs border-tabs">
      <li>
        <button
          type="button"
          [class.active]="section() === 'general'"
          (click)="section.set('general')"
        >
          General
        </button>
      </li>
      <li>
        <button
          type="button"
          [class.active]="section() === 'security'"
          (click)="section.set('security')"
        >
          Data security
        </button>
      </li>
    </ul>
    <div class="form-container mt-2 pt-1">
      <div [hidden]="section() !== 'general'">
        <div formArrayName="translations">
          @for (
            translation of form.controls.translations.controls;
            track translation;
            let index = $index
          ) {
            <div class="row mt-2 mb-3" [formGroupName]="index">
              <div class="col-sm-4">
                <label [for]="`tab-language-${index}`">Language</label>
                <select
                  class="form-control"
                  [id]="`tab-language-${index}`"
                  formControlName="language"
                >
                  @for (language of languages; track language) {
                    <option [value]="language" [disabled]="languageUsed(language, index)">
                      {{ language }}
                    </option>
                  }
                </select>
              </div>
              <div class="col title-field">
                <label [for]="`tab-title-${index}`">Tab Title</label>
                <input
                  type="text"
                  class="form-control"
                  placeholder="Name"
                  [id]="`tab-title-${index}`"
                  formControlName="title"
                />
              </div>
              @if (index > 0) {
                <div class="col-auto pl-0 align-self-end">
                  <button
                    class="remove-language"
                    type="button"
                    title="Remove language"
                    (click)="removeLanguage(index)"
                  >
                    <img src="assets/images/delete-icon.svg" alt="Remove language" />
                  </button>
                </div>
              }
              <div class="col-sm-12 mt-2">
                <label [for]="`tab-description-${index}`">Description</label>
                <textarea
                  class="form-control text-area"
                  placeholder="Enter Description"
                  rows="2"
                  [id]="`tab-description-${index}`"
                  formControlName="description"
                ></textarea>
              </div>
            </div>
          }
        </div>
        <button
          type="button"
          class="btn add-language"
          [disabled]="form.controls.translations.length === languages.length"
          (click)="addLanguage()"
        >
          <img src="assets/images/add-white.svg" alt="" />Add Language
        </button>
      </div>
      <div [hidden]="section() !== 'security'" class="mt-2">
        <div class="form-group">
          <label for="tab-personas">Personas</label>
          <app-multi-select
            controlId="tab-personas"
            [options]="personas"
            formControlName="personaIds"
          />
        </div>
        <div class="form-group">
          <label for="tab-roles">Roles</label>
          <app-multi-select controlId="tab-roles" [options]="roles" formControlName="roleIds" />
        </div>
      </div>
    </div>
  </div>
  <ng-container dialog-actions>
    <button appButton="cancel" type="button" (click)="dismissed.emit()">
      <img class="button-icon" src="assets/images/rejected.svg" alt="" />Cancel
    </button>
    <button appButton="submit" type="button" (click)="save()">
      <img class="button-icon" src="assets/images/save-icon.svg" alt="" />Save
    </button>
  </ng-container>
</app-dialog>
