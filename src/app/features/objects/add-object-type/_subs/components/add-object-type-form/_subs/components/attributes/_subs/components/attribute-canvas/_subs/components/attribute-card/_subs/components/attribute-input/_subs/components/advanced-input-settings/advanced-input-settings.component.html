<app-dialog
  title="Manage Attributes"
  titleId="advanced-input-settings-title"
  panel="side"
  [showHeader]="false"
  (dismissed)="dismissed.emit()"
>
  <div [formGroup]="form">
    <nav class="nav nav-tabs settings-tabs">
      @if (!sourceOnly) {
        <button
          type="button"
          [class.active]="section() === 'general'"
          (click)="section.set('general')"
        >
          General
        </button>
        @if (dynamic) {
          <button
            type="button"
            [class.active]="section() === 'columns'"
            (click)="section.set('columns')"
          >
            Columns
          </button>
        }
      }
      @if (!dynamic) {
        <button
          type="button"
          [class.active]="section() === 'source'"
          (click)="section.set('source')"
        >
          Data Sorce
        </button>
      }
      @if (!sourceOnly) {
        <button
          type="button"
          [class.active]="section() === 'validation'"
          (click)="section.set('validation')"
        >
          Validation
        </button>
        <button
          type="button"
          [class.active]="section() === 'conditional'"
          (click)="section.set('conditional')"
        >
          Conditional
        </button>
        <button
          type="button"
          [class.active]="section() === 'security'"
          (click)="section.set('security')"
        >
          Data security
        </button>
      }
    </nav>
    <div [hidden]="section() !== 'general'">
      <app-input-general-settings [referenceOnly]="true" />
    </div>
    <div [hidden]="section() !== 'source'" formGroupName="dataSource">
      <app-input-source-settings />
    </div>
    <div [hidden]="section() !== 'validation'" formGroupName="validation">
      <app-input-validation-settings />
    </div>
    <div [hidden]="section() !== 'conditional'" formGroupName="conditional">
      <app-input-conditional-settings [fields]="fields" />
    </div>
    <div [hidden]="section() !== 'security'"><app-input-security-settings /></div>
    <div class="form-container mt-2" [hidden]="section() !== 'columns'">
      @for (column of columns.controls; track column; let i = $index) {
        <div class="form-group row align-items-end">
          <div class="col-sm-6">
            <label [for]="`table-column-${i}`">Column name</label
            ><input
              type="text"
              class="form-control"
              [id]="`table-column-${i}`"
              [formControl]="column"
            />
          </div>
          <button
            type="button"
            class="remove-column"
            title="Remove column"
            (click)="columns.removeAt(i)"
          >
            ×
          </button>
        </div>
      }
      <button type="button" class="btn add-column" (click)="addColumn()">
        <img src="assets/images/add-white.svg" alt="" />Add Column
      </button>
    </div>
  </div>
  <ng-container dialog-actions
    ><button type="button" appButton="cancel" (click)="dismissed.emit()">
      <img class="button-icon" src="assets/images/rejected.svg" alt="" />Cancel</button
    ><button type="button" appButton="submit" (click)="save()">
      <img class="button-icon" src="assets/images/save-icon.svg" alt="" />Save
    </button></ng-container
  >
</app-dialog>
